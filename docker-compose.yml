services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tautan
      POSTGRES_PASSWORD: tautan
      POSTGRES_DB: tautan
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: development # the image defaults to production, which rejects these dev values
      DATABASE_URL: postgres://tautan:tautan@db:5432/tautan?sslmode=disable
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:8080
    volumes: [uploads:/data/uploads]
    depends_on: [db]
volumes:
  pgdata:
  uploads:
